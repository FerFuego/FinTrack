version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: fintrack_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: fintrack_db
      MYSQL_USER: fintrack
      MYSQL_PASSWORD: fintrack_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fintrack_net

  api:
    image: php:8.2-fpm
    container_name: fintrack_api
    working_dir: /var/www
    volumes:
      - ./fintrack_api:/var/www
    networks:
      - fintrack_net
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: fintrack_nginx
    ports:
      - "8000:80"
    volumes:
      - ./fintrack_api:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - fintrack_net
    depends_on:
      - api

volumes:
  mysql_data:

networks:
  fintrack_net:
    driver: bridge
